{% load static %}

<!doctype html>
<html lang="en" data-theme="winter">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <!-- Google Fonts -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shanti&family=Sofia+Sans+Extra+Condensed:wght@1&display=swap"
          rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>      
    
    <!-- Material Icons (Google Font Icons) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">



    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"
            integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
            crossorigin="anonymous"></script>

    <style>
        /* Hide scrollbar but keep functionality */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>

    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-gray-100 min-h-screen font-sans text-gray-900">

    <!-- Main Layout -->
    <main class="fixed inset-0 top-16 flex flex-col overflow-hidden">
        
        <!-- Main Content - Scrollable without visible scrollbar -->
        <section class=" container mx-auto px-4 flex-1 overflow-y-auto mt-3 px-4 scrollbar-hide">
            {% block content %}
            {% endblock %}
        </section>

    </main>

    <div id="modal-container"></div>

    <!-- Flowbite JS -->
    <script src="{% static 'node_modules/flowbite/dist/flowbite.min.js' %}"></script>

    <!-- Create Group Modal -->
    {% include 'chema/partials/create_group_modal.html' %}
    
    <!-- Deceased Modal -->
    {% include 'condolence/partials/deceased_modal.html' %}
   
    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        function initDatepickers() {
            flatpickr(".datepicker-input", {
                dateFormat: "Y-m-d",
                allowInput: true,
                monthSelectorType: "static"
            });
        }
        document.addEventListener("DOMContentLoaded", initDatepickers);
        document.body.addEventListener("htmx:afterSwap", initDatepickers);
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
